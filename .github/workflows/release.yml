name: release

# dst-mac-server 发布流水线（linux/arm64 专用）
# - push tag (v*)：构建并发布镜像到 GHCR（零配置）；若配置了
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets 则同步发布 Docker Hub，
#   并创建 GitHub Release
# - push main / PR：仅构建守门，不发布
# 前端 dist 与 Go 交叉编译均在 Dockerfile 多阶段构建内完成，本流水线只管构建镜像。
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tag 触发时创建 GitHub Release
  packages: write # 推送 GHCR

env:
  IMAGE_NAME: dst-mac-server

jobs:
  build:
    # arm64 原生 runner：目标平台即运行平台，无需 QEMU，box64 编译也快
    runs-on: ubuntu-24.04-arm
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 仅构建（守门/验证）：tag 推送时若未配置 Docker Hub secrets 则构建不推送
      - name: Build (no push)
        if: github.ref_type == 'tag' && env.DOCKERHUB_USERNAME == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 发布目标只有 Docker Hub（国内拉取友好；GHCR 分发已于 2026-09-22 移除，
      # 源码分发义务由本公开仓库满足）
      - name: Login to Docker Hub
        if: github.ref_type == 'tag' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.ref_type == 'tag' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 拉取镜像（linux/arm64）

            ```bash
            # GHCR（随 tag 自动发布）
            docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dst-mac-server:${{ github.ref_name }}

            # Docker Hub（若已配置 DOCKERHUB secrets）
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dst-mac-server:${{ github.ref_name }}
            ```

            使用说明见仓库 README。
